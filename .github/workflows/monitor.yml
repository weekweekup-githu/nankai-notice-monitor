name: Nankai Notice Monitor

on:
  schedule:
    # UTC 05:00/11:00/15:00/22:00 = 北京时间 13:00/19:00/23:00/次日06:00
    - cron: '0 5,11,15,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nankai-notice-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check announcements and push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          ALWAYS_NOTIFY: ${{ vars.ALWAYS_NOTIFY || 'true' }}
        run: python monitor.py
      - name: Save successful check and notice history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record notice check'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
